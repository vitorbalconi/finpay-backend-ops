replicaCount: 1

image:
  repository: ghcr.io/vitorbalconi/finpay-backend
  tag: 1.0.0
  pullPolicy: IfNotPresent

service:
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
